<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUMH - Artigo</title>
    <style>
        :root {
            --primary-color: #8A2BE2;
            --secondary-color: #00CED1;
            --accent-color: #FFD700;
            --dark-bg: #0a0a0a;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text-light: #f8f9fa;
            --text-secondary: #adb5bd;
            --content-max: 1100px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, var(--dark-bg) 0%, #1a1a2e 50%, #16213e 100%);
            color: var(--text-light);
            line-height: 1.7;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Particles */
        .particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(255,255,255,.3);
            border-radius: 50%;
            animation: float 15s linear infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 1;
            }

            90% {
                opacity: 1;
            }

            100% {
                transform: translateY(-100vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Top bar */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(0,0,0,.9);
            backdrop-filter: blur(20px);
            z-index: 1000;
            border-bottom: 1px solid rgba(255,255,255,.1);
        }

        nav {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

            .nav-links a {
                color: var(--text-light);
                text-decoration: none;
                transition: color .3s ease;
                font-weight: 500;
            }

                .nav-links a:hover {
                    color: var(--accent-color);
                }

        /* Content */
        .container {
            max-width: var(--content-max);
            margin: 120px auto 64px;
            padding: 0 24px;
        }

        .prose {
            font-size: 1.05rem;
        }

            .prose h1, .prose h2, .prose h3 {
                margin: 1.3em 0 .6em;
                line-height: 1.25;
            }

            .prose h1 {
                font-size: clamp(1.8rem, 2.4vw, 2.4rem);
            }

            .prose h2 {
                font-size: clamp(1.4rem, 2vw, 1.9rem);
            }

            .prose h3 {
                font-size: clamp(1.2rem, 1.8vw, 1.5rem);
            }

            .prose p, .prose ul, .prose ol, .prose blockquote, .prose pre {
                margin: 1em 0;
            }

            .prose a {
                color: #7dd3fc;
                text-decoration: none;
            }

                .prose a:hover {
                    text-decoration: underline;
                }

            .prose code {
                background: rgba(255,255,255,.08);
                padding: .15em .35em;
                border-radius: .35em;
                font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            }

            .prose pre {
                overflow: auto;
                background: rgba(255,255,255,.06);
                padding: 14px;
                border-radius: 10px;
                border: 1px solid rgba(255,255,255,.08);
            }

        hr {
            border: none;
            height: 1px;
            background: rgba(255,255,255,.12);
            margin: 28px 0;
        }

        /* Blockquote */
        .prose blockquote {
            border-left: 4px solid var(--secondary-color);
            background: rgba(255,255,255,.04);
            padding: .75rem 1rem;
            margin-left: 0;
            margin-right: 0;
            border-radius: 8px;
        }

            .prose blockquote p {
                margin: .4em 0;
                color: var(--text-secondary);
            }

        .toolbar {
            display: flex;
            align-items: center;
            gap: .6rem;
            margin: 0 0 8px;
        }

        .back {
            display: inline-flex;
            align-items: center;
            gap: .5rem;
            padding: .45rem .9rem;
            border-radius: 24px;
            background: rgba(255,255,255,.08);
            color: var(--text-light);
            text-decoration: none;
            border: 1px solid rgba(255,255,255,.12);
        }

            .back:hover {
                background: rgba(255,255,255,.12);
            }

        .katex {
            font-size: 1em !important;
        }

        eq {
            display: inline-block;
        }

        eqn {
            display: block
        }

        section.eqno {
            display: flex;
            flex-direction: row;
            align-content: space-between;
            align-items: center;
        }

            section.eqno > eqn {
                width: 100%;
                margin-left: 3em;
            }

            section.eqno > span {
                width: 3em;
                text-align: right;
            }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/markdown-it@14/dist/markdown-it.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it-texmath@1.0.0/texmath.min.js"></script>
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
</head>
<body>
    <div class="particles" id="particles"></div>
    <header>
        <nav>
            <div class="logo">HUMH v1.00</div>
            <ul class="nav-links">
                <li><a href="index.html">Início</a></li>
            </ul>
        </nav>
    </header>
    <main class="container">
        <article id="content" class="prose"></article>
    </main>

    <script>
        (function createParticles() {
            const particlesContainer = document.getElementById('particles');
            if (!particlesContainer) return;
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (15 + Math.random() * 10) + 's';
                particlesContainer.appendChild(particle);
            }
        })();
    </script>

    <script>
        async function render() {
            const res = await fetch('./content/resumo.md', { cache: 'no-store' });
            const md = await res.text();
            const mdp = window.markdownit({ html: true, breaks: true, linkify: true })
                .use(window.texmath, { engine: window.MathJax, delimiters: 'dollars' });
            document.getElementById('content').innerHTML = mdp.render(md);
            if (window.MathJax?.typesetPromise) { await window.MathJax.typesetPromise(); }
        }
        render();
    </script>

</body>
</html>
