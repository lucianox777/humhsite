name: HUMH A1b freeze R3

on:
  push:
    branches: [ humh-a1b-freeze-r3 ]
    paths:
      - '.github/workflows/humh_a1b_freeze_r3.yml'

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: humh-a1b-freeze-r3
      - name: Apply A1b freeze R3
        run: python scripts/humh_a1b_freeze_r3.py
      - name: Verify materialized tree
        run: |
          cd source/HUMH.Api/wwwroot/content/experimentos/atencao/v2.0.0
          python 03_integridade/verify.py
      - name: Commit frozen state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/HUMH.Api/wwwroot/content/experimentos/atencao
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'freeze A1b assignment semantics and eta admissibility criterion'
            git push origin humh-a1b-freeze-r3
          fi
