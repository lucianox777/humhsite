name: HUMH A1b prepublication audit cleanup

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/humh_a1b_cleanup_prepublication.py'
      - '.github/workflows/humh_a1b_audit_cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply prepublication cleanup
        run: |
          sed -i 's/resolver observer_microdynamic_contract/resolver a microdinâmica do observador/g' scripts/humh_a1b_cleanup_prepublication.py
          python scripts/humh_a1b_cleanup_prepublication.py
      - name: Verify materialized tree
        run: |
          cd source/HUMH.Api/wwwroot/content/experimentos/atencao/v2.0.0
          python 03_integridade/verify.py
      - name: Commit corrected state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/HUMH.Api/wwwroot/content/experimentos/atencao
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'audit A1b derivational content and clean v2.0.0'
            git push origin main
          fi
