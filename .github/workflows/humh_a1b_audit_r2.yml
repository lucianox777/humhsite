name: HUMH A1b structural audit R2

on:
  push:
    branches: [ humh-a1b-audit-r2 ]
    paths:
      - '.github/workflows/humh_a1b_audit_r2.yml'
      - 'scripts/humh_a1b_audit_r2_patch.py'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: humh-a1b-audit-r2
      - name: Apply A1b R2 consistency patch
        run: python scripts/humh_a1b_audit_r2_patch.py
      - name: Verify materialized tree
        run: |
          cd source/HUMH.Api/wwwroot/content/experimentos/atencao/v2.0.0
          python 03_integridade/verify.py
      - name: Commit audited state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/HUMH.Api/wwwroot/content/experimentos/atencao
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'fix A1b R2 consistency after homogeneous freeze'
            git push origin humh-a1b-audit-r2
          fi
