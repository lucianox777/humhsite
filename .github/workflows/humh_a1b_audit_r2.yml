name: HUMH A1b structural audit R2

on:
  push:
    branches: [ humh-a1b-audit-r2 ]
    paths:
      - '.github/workflows/humh_a1b_audit_r2.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: humh-a1b-audit-r2
      - name: Apply A1b structural audit R2
        run: python scripts/humh_a1b_audit_r2.py
      - name: Verify materialized tree
        run: |
          cd source/HUMH.Api/wwwroot/content/experimentos/atencao/v2.0.0
          python 03_integridade/verify.py
      - name: Commit audited state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/HUMH.Api/wwwroot/content/experimentos/atencao
          git commit -m 'refine A1b structural audit and freeze logical-cycle semantics'
          git push origin humh-a1b-audit-r2
