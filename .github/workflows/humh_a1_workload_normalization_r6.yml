name: HUMH A1 workload normalization R6

on:
  push:
    branches: [ humh-a1-workload-normalization-r6 ]
    paths:
      - '.github/workflows/humh_a1_workload_normalization_r6.yml'
      - 'scripts/humh_a1_workload_normalization_r6.py'

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: humh-a1-workload-normalization-r6
      - name: Apply workload normalization R6
        run: python scripts/humh_a1_workload_normalization_r6.py
      - name: Verify materialized tree
        run: |
          cd source/HUMH.Api/wwwroot/content/experimentos/atencao/v2.0.0
          python 03_integridade/verify.py
      - name: Commit frozen state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/HUMH.Api/wwwroot/content/experimentos/atencao
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'normalize A1 workload to integer opportunity class K_C'
            git push origin humh-a1-workload-normalization-r6
          fi
