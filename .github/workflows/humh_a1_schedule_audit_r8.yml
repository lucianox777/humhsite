name: HUMH A1 schedule audit R8

on:
  push:
    branches: [ humh-a1-schedule-audit-r8 ]
    paths:
      - '.github/workflows/humh_a1_schedule_audit_r8.yml'
      - 'scripts/humh_a1_schedule_audit_r8_patch.py'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: humh-a1-schedule-audit-r8
          fetch-depth: 0
      - name: Apply prepublication R8 consolidation
        run: python scripts/humh_a1_schedule_audit_r8_patch.py
      - name: Verify normative hashes and audit schedules
        run: |
          cd source/HUMH.Api/wwwroot/content/experimentos/atencao/v2.0.0
          python 03_integridade/audit_schedules.py
          python 03_integridade/verify.py
      - name: Commit verified normative state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/HUMH.Api/wwwroot/content/experimentos/atencao
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'record A1 schedule feasibility and derivational audit R8'
            git push origin humh-a1-schedule-audit-r8
          fi
