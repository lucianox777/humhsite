name: HUMH A1 work-unit normalization R5

on:
  push:
    branches: [ humh-a1-work-unit-normalization-r5 ]
    paths:
      - '.github/workflows/humh_a1_work_unit_normalization_r5.yml'
      - 'scripts/humh_a1_work_unit_normalization_r5.py'

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: humh-a1-work-unit-normalization-r5
      - name: Apply work-unit normalization R5
        run: python scripts/humh_a1_work_unit_normalization_r5.py
      - name: Verify materialized tree
        run: |
          cd source/HUMH.Api/wwwroot/content/experimentos/atencao/v2.0.0
          python 03_integridade/verify.py
      - name: Commit frozen state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add source/HUMH.Api/wwwroot/content/experimentos/atencao
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'normalize A1 observer work unit and remove B as fitted parameter'
            git push origin humh-a1-work-unit-normalization-r5
          fi
